name: Extract My AI Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir -p /tmp/myproject
          unzip -o "$ZIP_FILE" -d /tmp/myproject
          cp -a /tmp/myproject/. .
          rm -f "$ZIP_FILE"

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract My AI Studio project"
            git push
          fi
